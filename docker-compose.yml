name: subkit

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  subkit_data:
  subkit_pgdata:

services:
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_USER: subkit
      POSTGRES_PASSWORD: ${SUBKIT_DB_PASSWORD:-subkit-local-only}
      POSTGRES_DB: subkit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - subkit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subkit -d subkit"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *default-logging

  engine:
    image: ${SUBKIT_IMAGE:-mikebild/subkit:${SUBKIT_IMAGE_TAG:-6.22.37}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://subkit:${SUBKIT_DB_PASSWORD:-subkit-local-only}@postgres:5432/subkit
      MASTER_KEY: ${MASTER_KEY:-}
      NODE_ENV: production
      LOG_FORMAT: ${LOG_FORMAT:-ndjson}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SUBKIT_HOST_PORT:-3000}:3000"
    volumes:
      - subkit_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:3000/ready >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    logging: *default-logging
