# Subkit production-shaped local stack.
#
# Quick start (from repo root):
#   docker compose up -d --build
#   # or: bun run compose:up
#
# Profiles:
#   (default)  postgres + migrate + seed + engine
#   storage    adds MinIO (S3-compatible object storage)
#   tunnel     adds the tunnel-agent
#
# Every value referenced with ${...} has a documented default in
# .env.example — copy it to .env before first boot.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  subkit:
    driver: bridge

volumes:
  subkit_pgdata:
  subkit_minio:
  subkit_blobs:

services:
  # ---------------------------------------------------------------------
  # PostgreSQL — primary state store.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [subkit]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subkit}
      POSTGRES_DB: ${POSTGRES_DB:-subkit}
    ports:
      # Exposed for local tooling; remove in production or bind to 127.0.0.1.
      - "5432:5432"
    volumes:
      - subkit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subkit} -d ${POSTGRES_DB:-subkit}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *default-logging
    # Production reference limits (not hard-enforced in compose v2 without swarm):
    # mem_limit: 1g
    # cpus: 1.0

  # ---------------------------------------------------------------------
  # MinIO — optional S3-compatible object storage.
  # Enable with: docker compose --profile storage up -d
  # ---------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["storage"]
    networks: [subkit]
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-subkit}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-subkitsubkit}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - subkit_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    # mem_limit: 512m
    # cpus: 0.5

  # ---------------------------------------------------------------------
  # One-shot migration runner.
  # Applies drizzle migrations from apps/engine/src/db/migrations and exits.
  # The engine service depends on this having completed successfully.
  # ---------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    image: subkit/migrate:local
    restart: "no"
    networks: [subkit]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Point at the compose-internal postgres regardless of what the host
      # .env file contains (which usually targets localhost).
      DATABASE_URL: postgres://${POSTGRES_USER:-subkit}:${POSTGRES_PASSWORD:-subkit}@postgres:5432/${POSTGRES_DB:-subkit}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required — set it in .env (openssl rand -hex 32)}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-ndjson}
    logging: *default-logging

  # ---------------------------------------------------------------------
  # One-shot seed runner.
  # Seeds RBAC, default tenant, admin user, and dev fixtures. Idempotent.
  # ---------------------------------------------------------------------
  seed:
    image: subkit/migrate:local
    entrypoint: ["bun", "run", "apps/engine/src/db/seed.ts"]
    restart: "no"
    networks: [subkit]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-subkit}:${POSTGRES_PASSWORD:-subkit}@postgres:5432/${POSTGRES_DB:-subkit}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required — set it in .env (openssl rand -hex 32)}
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-ndjson}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-default}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Subkit}
      BOOTSTRAP_CREATE_METRICS_KEY: ${BOOTSTRAP_CREATE_METRICS_KEY:-}
    logging: *default-logging

  # ---------------------------------------------------------------------
  # Engine — the Subkit workflow engine.
  # ---------------------------------------------------------------------
  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    image: subkit/engine:local
    restart: unless-stopped
    networks: [subkit]
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      TUNNEL_PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-subkit}:${POSTGRES_PASSWORD:-subkit}@postgres:5432/${POSTGRES_DB:-subkit}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required — set it in .env (openssl rand -hex 32)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-ndjson}
      LLM_PRIMARY: ${LLM_PRIMARY:-}
      LLM_FALLBACK: ${LLM_FALLBACK:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      FILE_STORAGE_ENABLED: ${FILE_STORAGE_ENABLED:-false}
      FILE_STORAGE_ROOT: /var/data/blobs
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_LOGIN_URL: ${FIREBASE_LOGIN_URL:-}
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - subkit_blobs:/var/data/blobs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    # mem_limit: 2g
    # cpus: 2.0

  # ---------------------------------------------------------------------
  # Tunnel agent — optional, for remote tool exposure.
  # Enable with: docker compose --profile tunnel up -d
  # ---------------------------------------------------------------------
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    image: subkit/agent:local
    restart: unless-stopped
    profiles: ["tunnel"]
    networks: [subkit]
    depends_on:
      engine:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SUBKIT_ENGINE_URL: ${TUNNEL_ENGINE_URL:-ws://engine:3001}
      SUBKIT_API_KEY: ${TUNNEL_AGENT_KEY:-}
      SUBKIT_TARGETS: ${TUNNEL_TARGETS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    logging: *default-logging
    # mem_limit: 256m
    # cpus: 0.5
