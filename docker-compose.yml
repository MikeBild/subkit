# Local development backend services for the subkit engine.
#
# 4.2.0: this compose file is **dev-only**. Production deploys are
# systemd-native (see deploy/systemd/subkit-engine.service); the engine
# itself is no longer containerised. For local dev we still bring up
# postgres in docker for convenience (single command, no host install,
# isolated volume).
#
# Quick start (from repo root):
#   docker compose up -d              # postgres only
#   docker compose --profile storage up -d  # adds MinIO (S3 API)
#   bun run dev                        # runs the engine on the host
#
# The engine reads DATABASE_URL=postgres://subkit:subkit@127.0.0.1:5432/subkit
# (default in .env.example) and listens on :3000.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  subkit_pgdata:
  subkit_minio:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subkit}
      POSTGRES_DB: ${POSTGRES_DB:-subkit}
    ports:
      - "5432:5432"
    volumes:
      - subkit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subkit} -d ${POSTGRES_DB:-subkit}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *default-logging

  # MinIO — optional S3-compatible object storage for tests that
  # exercise the storage subsystem locally. Enable with:
  #   docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["storage"]
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-subkit}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-subkitsubkit}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - subkit_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
