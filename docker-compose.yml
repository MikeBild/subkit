# SubKit — engine, PostgreSQL, private object storage, and a one-shot bucket
# initializer. This file is served by every running engine at
# GET /docker-compose.yml, so it has to stand on its own:
#
#   curl -O https://<engine-host>/docker-compose.yml
#   MASTER_KEY=$(openssl rand -hex 32) docker compose up -d
#
# MASTER_KEY is the one value with no safe default. It encrypts stored secret
# versions, so a generated-on-every-start key would make them unreadable after
# the first restart. Keep it: losing it loses the secrets it protects.
# Everything else below carries a local-only default.
#
# From a checkout, `bun run start:local` does this and the first-run setup in
# one command; `sh scripts/ensure-env.sh` alone writes a .env with a generated
# MASTER_KEY.
name: subkit

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  subkit_pgdata:
  subkit_object_data:

services:
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_USER: subkit
      POSTGRES_PASSWORD: ${SUBKIT_DB_PASSWORD:-subkit-local-only}
      POSTGRES_DB: subkit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - subkit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subkit -d subkit"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *default-logging

  object-store:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: subkit
      MINIO_ROOT_PASSWORD: subkit-object-local-only
    volumes:
      - subkit_object_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *default-logging

  object-store-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://object-store:9000 subkit subkit-object-local-only && mc mb --ignore-existing local/subkit",
      ]

  engine:
    image: ${SUBKIT_IMAGE:-mikebild/subkit:${SUBKIT_IMAGE_TAG:-8.0.78}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://subkit:${SUBKIT_DB_PASSWORD:-subkit-local-only}@postgres:5432/subkit
      MASTER_KEY: ${MASTER_KEY:-}
      # Pass-through with no value: Compose forwards this only when it is set,
      # in .env or in the shell, and omits it otherwise. That matters — the
      # engine validates the key as 64..128 characters, so injecting an empty
      # string would stop a plain `docker compose up` from booting at all.
      # When it is set the engine adopts it as the one-time first-run token
      # instead of minting a random one, which is what lets
      # `bun run start:local` complete setup without scraping the startup banner.
      SUBKIT_BOOTSTRAP_KEY:
      NODE_ENV: production
      OBJECT_STORAGE_ENDPOINT: http://object-store:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: subkit
      OBJECT_STORAGE_ACCESS_KEY_ID: subkit
      OBJECT_STORAGE_SECRET_ACCESS_KEY: subkit-object-local-only
      OBJECT_STORAGE_PATH_STYLE: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SUBKIT_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:3000/ready >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    logging: *default-logging
