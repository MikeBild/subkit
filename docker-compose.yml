# Subkit production-shaped local stack.
#
# Quick start (from repo root):
#   docker compose up -d --build
#   # or: bun run compose:up
#
# Profiles:
#   (default)  postgres + engine
#   storage    adds MinIO (S3-compatible object storage)
#   tunnel     adds the tunnel-agent
#
# Migrations + seed run inside the engine binary on every boot — no
# separate `migrate` or `seed` containers (issue #149).
#
# Every value referenced with ${...} has a documented default in
# .env.example — copy it to .env before first boot.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  subkit:
    driver: bridge

volumes:
  subkit_pgdata:
  subkit_minio:
  subkit_blobs:

services:
  # ---------------------------------------------------------------------
  # PostgreSQL — primary state store.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [subkit]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subkit}
      POSTGRES_DB: ${POSTGRES_DB:-subkit}
    ports:
      # Exposed for local tooling; remove in production or bind to 127.0.0.1.
      - "5432:5432"
    volumes:
      - subkit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subkit} -d ${POSTGRES_DB:-subkit}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *default-logging
    # Production reference limits (not hard-enforced in compose v2 without swarm):
    # mem_limit: 1g
    # cpus: 1.0

  # ---------------------------------------------------------------------
  # MinIO — optional S3-compatible object storage.
  # Enable with: docker compose --profile storage up -d
  # ---------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["storage"]
    networks: [subkit]
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-subkit}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-subkitsubkit}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - subkit_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    # mem_limit: 512m
    # cpus: 0.5

  # ---------------------------------------------------------------------
  # Engine — the Subkit workflow engine.
  # Migrations + seed run in-process on boot (issue #149); there are
  # no separate `migrate` / `seed` services to depend on.
  # ---------------------------------------------------------------------
  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
      args:
        # Pass-through from the host so the compiled binary stamps the
        # right version into /v1/health. Defaults to 0.0.0-dev when the
        # caller did not export ENGINE_VERSION; the engine-rebuild
        # script reads package.json and exports it before `docker
        # compose build`.
        ENGINE_VERSION: ${ENGINE_VERSION:-0.0.0-dev}
    # Local builds skip the bundled CLI binaries (docker/binaries/ has
    # only a .gitkeep), so /install/sk-* and /install/agent-* return
    # 404 and the install script falls back to GitHub Releases — fine
    # for dev. Run `bash scripts/release/embed-binaries.sh --from-local`
    # before `docker compose build` to populate them and smoke the
    # bundled flow end-to-end.
    image: subkit/engine:local
    restart: unless-stopped
    networks: [subkit]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      TUNNEL_PORT: "3001"
      # Mirror the build-arg into runtime env so the binary's
      # `process.env.ENGINE_VERSION` lookup wins over the bundled
      # fallback. Stays in sync with the build-arg above.
      ENGINE_VERSION: ${ENGINE_VERSION:-0.0.0-dev}
      DATABASE_URL: postgres://${POSTGRES_USER:-subkit}:${POSTGRES_PASSWORD:-subkit}@postgres:5432/${POSTGRES_DB:-subkit}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required — set it in .env (openssl rand -hex 32)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-ndjson}
      LLM_PRIMARY: ${LLM_PRIMARY:-}
      LLM_FALLBACK: ${LLM_FALLBACK:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      FILE_STORAGE_ENABLED: ${FILE_STORAGE_ENABLED:-false}
      FILE_STORAGE_ROOT: /var/data/blobs
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_LOGIN_URL: ${FIREBASE_LOGIN_URL:-}
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - subkit_blobs:/var/data/blobs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    # mem_limit: 2g
    # cpus: 2.0

  # ---------------------------------------------------------------------
  # Tunnel agent — optional, for remote tool exposure.
  # Enable with: docker compose --profile tunnel up -d
  # ---------------------------------------------------------------------
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    image: subkit/agent:local
    restart: unless-stopped
    profiles: ["tunnel"]
    networks: [subkit]
    depends_on:
      engine:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SUBKIT_ENGINE_URL: ${TUNNEL_ENGINE_URL:-ws://engine:3001}
      SUBKIT_API_KEY: ${TUNNEL_AGENT_KEY:-}
      SUBKIT_TARGETS: ${TUNNEL_TARGETS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    logging: *default-logging
    # mem_limit: 256m
    # cpus: 0.5
