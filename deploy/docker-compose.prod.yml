# Production overlay for Subkit engine on Digital Ocean droplets.
#
# Layout on the droplet (see scripts/do-bootstrap.sh):
#   /opt/subkit/
#     docker-compose.yml          (copy of root docker-compose.yml)
#     docker-compose.prod.yml     (this file)
#     .env                        (operator-edited, chmod 600)
#     caddy/Caddyfile             (copy of deploy/caddy/Caddyfile)
#
# Usage:
#   cd /opt/subkit
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs. the base compose:
#   - engine: pulls from DOCR instead of building locally.
#   - engine: no host port publish; mounts host docker socket for sandbox
#     spawning. Migrations + seed run in-process on engine boot
#     (issue #149) — no separate migrate/seed containers.
#   - caddy: new reverse proxy fronting engine ports 3000/3001 with always-on
#     Let's Encrypt TLS.
#   - postgres: keeps internal port only (no host publish in production).

networks:
  subkit:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

services:
  postgres:
    ports: !reset []

  engine:
    build: !reset null
    image: registry.digitalocean.com/subkit/engine:${ENGINE_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports: !reset []
    expose:
      - "3000"
      - "3001"
    volumes:
      - subkit_blobs:/var/data/blobs
    environment:
      ENGINE_VERSION: ${ENGINE_VERSION:-latest}
      TUNNEL_ENGINE_URL: ${TUNNEL_ENGINE_URL:-wss://subkit-tunnel.mikebild.dev}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_LOGIN_URL: ${FIREBASE_LOGIN_URL:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [subkit]
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required for Let's Encrypt}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
