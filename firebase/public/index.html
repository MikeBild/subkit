<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subkit — Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
                                                                                                                                                                body {
                                                                                                                                                                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                                                                                                                                                                  background: #0d1117;
                                                                                                                                                                  color: #c9d1d9;
                                                                                                                                                                  display: flex;
                                                                                                                                                                  align-items: center;
                                                                                                                                                                  justify-content: center;
                                                                                                                                                                  min-height: 100vh;
                                                                                                                                                                }
                                                                                                                                                                .card {
                                                                                                                                                                  background: #161b22;
                                                                                                                                                                  border: 1px solid #30363d;
                                                                                                                                                                  border-radius: 12px;
                                                                                                                                                                  padding: 40px;
                                                                                                                                                                  max-width: 400px;
                                                                                                                                                                  width: 100%;
                                                                                                                                                                  text-align: center;
                                                                                                                                                                }
                                                                                                                                                                h1 { font-size: 24px; margin-bottom: 8px; color: #58a6ff; }
                                                                                                                                                                p { color: #8b949e; margin-bottom: 24px; font-size: 14px; }
                                                                                                                                                                .btn {
                                                                                                                                                                  display: flex;
                                                                                                                                                                  align-items: center;
                                                                                                                                                                  justify-content: center;
                                                                                                                                                                  gap: 12px;
                                                                                                                                                                  width: 100%;
                                                                                                                                                                  padding: 12px 24px;
                                                                                                                                                                  border: 1px solid #30363d;
                                                                                                                                                                  border-radius: 8px;
                                                                                                                                                                  background: #21262d;
                                                                                                                                                                  color: #c9d1d9;
                                                                                                                                                                  font-size: 16px;
                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                  transition: background 0.2s, border-color 0.2s;
                                                                                                                                                                }
                                                                                                                                                                .btn:hover { background: #30363d; border-color: #58a6ff; }
                                                                                                                                                                .btn:disabled { opacity: 0.5; cursor: not-allowed; }
                                                                                                                                                                .btn svg { width: 20px; height: 20px; }
                                                                                                                                                                .status { margin-top: 16px; font-size: 13px; min-height: 20px; }
                                                                                                                                                                .status.ok { color: #3fb950; }
                                                                                                                                                                .status.err { color: #f85149; }
                                                                                                                                                                .status.wait { color: #d29922; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Subkit</h1>
    <p>Sign in to continue to your workflow engine</p>
    <button type="button" class="btn" id="google-btn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24" role="img" aria-label="Google logo"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
    <div class="status" id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
                                                                                                                                                                import { GoogleAuthProvider, getAuth, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

                                                                                                                                                                const firebaseConfig = {
                                                                                                                                                                  projectId: "subkit-auth-prod",
                                                                                                                                                                  appId: "1:835838304162:web:9924e3482f99b054901cfb",
                                                                                                                                                                  storageBucket: "subkit-auth-prod.firebasestorage.app",
                                                                                                                                                                  apiKey: "AIzaSyBqqOxHjxKUIRoF5A1ldtu7lH73vSJ8j8s",
                                                                                                                                                                  authDomain: "subkit-auth-prod.firebaseapp.com",
                                                                                                                                                                  messagingSenderId: "835838304162"
                                                                                                                                                                };

                                                                                                                                                                const app = initializeApp(firebaseConfig);
                                                                                                                                                                const auth = getAuth(app);

                                                                                                                                                                window.signInWithGoogle = async () => {
                                                                                                                                                                  const btn = document.getElementById("google-btn");
                                                                                                                                                                  const status = document.getElementById("status");
                                                                                                                                                                  btn.disabled = true;
                                                                                                                                                                  status.className = "status wait";
                                                                                                                                                                  status.textContent = "Signing in...";

                                                                                                                                                                  try {
                                                                                                                                                                    const provider = new GoogleAuthProvider();
                                                                                                                                                                    const result = await signInWithPopup(auth, provider);
                                                                                                                                                                    const idToken = await result.user.getIdToken();

                                                                                                                                                                    // Check for CLI callback (localhost redirect from sk login)
                                                                                                                                                                    const params = new URLSearchParams(window.location.search);
                                                                                                                                                                    const callbackPort = params.get("callback_port");
                                                                                                                                                                    const callbackState = params.get("state");

                                                                                                                                                                    if (callbackPort) {
                                                                                                                                                                      status.className = "status wait";
                                                                                                                                                                      status.textContent = "Sending credentials to CLI...";
                                                                                                                                                                      const callbackUrl = new URL(`http://localhost:${callbackPort}/callback`);
                                                                                                                                                                      callbackUrl.searchParams.set("id_token", idToken);
                                                                                                                                                                      callbackUrl.searchParams.set("issuer", `https://securetoken.google.com/${firebaseConfig.projectId}`);
                                                                                                                                                                      callbackUrl.searchParams.set("email", result.user.email || "");
                                                                                                                                                                      if (callbackState) callbackUrl.searchParams.set("state", callbackState);
                                                                                                                                                                      window.location.href = callbackUrl.toString();
                                                                                                                                                                      return;
                                                                                                                                                                    }

                                                                                                                                                                    // Direct web visit — show success
                                                                                                                                                                    status.className = "status ok";
                                                                                                                                                                    status.textContent = `Signed in as ${result.user.email}`;
                                                                                                                                                                  } catch (err) {
                                                                                                                                                                    status.className = "status err";
                                                                                                                                                                    status.textContent = err.message;
                                                                                                                                                                    btn.disabled = false;
                                                                                                                                                                  }
                                                                                                                                                                };
  </script>
</body>
</html>
