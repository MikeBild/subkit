name: Bug report
description: Something does not work as documented.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest workflow, request or command that shows the problem.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `engine --version` or `subkit --version`, or the desktop app's About panel.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Cloud
        - Self-hosted (Docker)
        - Self-hosted (binary)
        - Desktop app
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Public diagnostics and attachments
      description: |
        Drag a sanitized diagnostic file into this field. Include the relevant runtime log excerpt or CLI/HTTP trace and, for a visual problem, a screenshot showing the symptom. Preserve the error code and event order. Explain which step the evidence shows and identify any evidence you could not capture.
        Remove credentials, personal data and private URLs before uploading. If you link an existing attachment, open it while signed out and verify that it downloads. For a suspected security vulnerability, follow SECURITY.md.
      placeholder: |
        Observed error or event:
        Diagnostic file:
        Runtime logs or command output:
        Screenshot, if applicable:
    validations:
      required: true
