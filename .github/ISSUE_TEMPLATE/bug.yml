name: Bug report
description: Something does not work as documented.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest workflow, request or command that shows the problem.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `engine --version` or `subkit --version`, or the desktop app's About panel.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Cloud
        - Self-hosted (Docker)
        - Self-hosted (binary)
        - Desktop app
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove keys, tokens and personal data first.
      render: text
