name: Bug report
description: Something in sk behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security vulnerabilities must not be
        reported here** — use the private flow described in [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Started the engine with …
        2. Ran `sk …`
        3. Expected …, but got …
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: Output of `sk --version` / `engine --version`, OS, and how you run the engine (binary, Docker, source).
      placeholder: |
        sk 1.0.0, engine 1.0.0
        macOS 15 / Ubuntu 24.04
        Docker image mikebild/subkit:latest
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Engine log lines or `~/.sk/debug.log` excerpts. **Redact secrets and tokens before pasting.**
      render: text
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest workflow definition, request payload, or command sequence that triggers the bug.
