name: Feature request
description: Propose a capability SubKit does not have yet.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work from your point of view.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: One checkable sentence that tells when this is finished.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
