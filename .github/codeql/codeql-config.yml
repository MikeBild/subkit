name: subkit
queries:
  - uses: security-extended
query-filters:
  - exclude:
      id: js/regex-injection
  - exclude:
      id: js/shell-command-constructed-from-input
  - exclude:
      id: js/shell-command-injection-from-environment
paths-ignore:
  - node_modules
  - "**/node_modules"
  - dist
  - vendor
  - tests
  - scripts
  - apps/engine/scripts
  - apps/engine/eval
  - apps/desktop/scripts
  - "**/__tests__"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - apps/engine/src/sandboxes/quickjs/stdlib/helpers/*.js
