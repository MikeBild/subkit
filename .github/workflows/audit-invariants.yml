name: audit-invariants

# Single CI gate for the engine's architectural invariants (file size,
# tenant filtering, route layering, coverage floors, subsystem count).
#
# The same script (`bun run audit:invariants`) is invoked from:
#   - this workflow (PR + nightly)
#   - the local release gate (`/verify`)
#   - the closed-loop driver in apps/engine/scripts/audit-loop/
#
# There is no second source of truth. If a check is wrong, fix the
# script — do not silence it here.

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 06:00 UTC; catches drift on main introduced by merges
    # that bypassed the PR check (rare but must be observable).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: audit-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  invariants:
    name: invariants
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match ci.yml + release.yml.
          bun-version: 1.3.12

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Subsystem-count contract test
        run: bun test tests/contract/subsystem-count.test.ts

      - name: Audit invariants
        run: bun run audit:invariants
