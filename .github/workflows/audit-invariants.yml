name: audit-invariants

# NIGHTLY drift run for the engine's architectural invariants (file size,
# tenant filtering, route layering, coverage floors, subsystem count,
# audit_log single writer, test servers binding loopback).
#
# The BLOCKING run lives in `ci.yml` as the `invariants` job — on `push` and
# `pull_request`, and listed in the `build` aggregate that branch protection
# requires. This workflow used to be the only run, on `pull_request` +
# `schedule` and outside `build`, which left a direct push to main covered by
# nothing (BEFUND-GATE-IST-NICHT-CI). It stays for the nightly, whose value is
# catching drift on main that no push triggered — a rotated dependency, a
# clock, an external pin.
#
# The same script (`bun run audit:invariants`) is invoked from:
#   - ci.yml (push + PR, blocking)
#   - this workflow (nightly + manual)
#   - the local release gate (`/verify`)
#   - the closed-loop driver in apps/engine/scripts/audit-loop/
#
# There is no second source of truth. If a check is wrong, fix the
# script — do not silence it here.

on:
  schedule:
    # Nightly at 06:00 UTC; catches drift on main that no push triggered.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: audit-invariants-${{ github.workflow }}-${{ github.ref }}
  # Never cancel: the only triggers left are the nightly and a manual run,
  # and both exist to produce a result.
  cancel-in-progress: false

jobs:
  invariants:
    name: invariants (nightly)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match ci.yml + release.yml.
          bun-version: 1.3.12

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Subsystem-count contract test
        run: bun test tests/contract/subsystem-count.test.ts

      - name: Audit invariants
        run: bun run audit:invariants
