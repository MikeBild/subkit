name: task-verify

on:
  push:
    branches: ["codekit/**"]

permissions:
  contents: read

concurrency:
  group: task-verify-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: subkit
          POSTGRES_PASSWORD: subkit-local-only
          POSTGRES_DB: subkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: echo "127.0.0.1 example.test identity.example.test" | sudo tee -a /etc/hosts
      - run: bun run test:unit --timeout 60000
        env:
          LC_ALL: C
