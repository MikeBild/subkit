name: desktop-release

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to build SubKit Desktop for; leave empty only for a dry run of the selected branch"
        required: false
      unsigned_dry_run:
        description: "Build unsigned and publish nothing"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.DESKTOP_RELEASE_AUTO != 'false' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      windows_signing: ${{ steps.resolve.outputs.windows_signing }}
      macos: ${{ steps.platforms.outputs.macos || 'true' }}
      windows: ${{ steps.platforms.outputs.windows || 'true' }}
    env:
      REQUESTED_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
      UNSIGNED_DRY_RUN: ${{ inputs.unsigned_dry_run }}
      WINDOWS_SIGNING: ${{ vars.DESKTOP_WINDOWS_SIGNING || 'certificate' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release commit
        id: resolve
        run: |
          set -euo pipefail
          case "$WINDOWS_SIGNING" in certificate|cloud) ;; *) echo "::error::DESKTOP_WINDOWS_SIGNING must be certificate or cloud" >&2; exit 1 ;; esac
          if [ -z "$REQUESTED_TAG" ] && [ "$UNSIGNED_DRY_RUN" = "true" ]; then
            COMMIT=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          else
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid release tag; only an unsigned dry run may leave it empty" >&2; exit 1; }
            TAGGED=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}") || { echo "::error::the tag $REQUESTED_TAG does not exist" >&2; exit 1; }
            COMMIT=$(git rev-list --first-parent refs/remotes/origin/main | grep -Fx -- "$TAGGED") || { echo "::error::the tag $REQUESTED_TAG points to a commit that is not on main" >&2; exit 1; }
          fi
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the release commit is not a full commit id" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            [ "$COMMIT" = "$EXPECTED_COMMIT" ] || { echo "::error::release tag differs from the released commit" >&2; exit 1; }
          fi
          VERSION=$(git show "$COMMIT:package.json" | jq -r '.version')
          DESKTOP_VERSION=$(git show "$COMMIT:apps/desktop/package.json" | jq -r '.version')
          if [ -n "$REQUESTED_TAG" ]; then
            [ "$REQUESTED_TAG" = "v$VERSION" ] || { echo "::error::release tag differs from package version" >&2; exit 1; }
          fi
          [ "$DESKTOP_VERSION" = "$VERSION" ] || { echo "::error::apps/desktop/package.json is at $DESKTOP_VERSION, the release at $VERSION" >&2; exit 1; }
          if [ "$UNSIGNED_DRY_RUN" = "true" ]; then DRY_RUN=true; else DRY_RUN=false; fi
          {
            echo "revision=$COMMIT"
            echo "tag=$REQUESTED_TAG"
            echo "version=$VERSION"
            echo "dry_run=$DRY_RUN"
            echo "windows_signing=$WINDOWS_SIGNING"
          } >> "$GITHUB_OUTPUT"

      - name: Choose the platforms whose signing values are set
        id: platforms
        if: ${{ steps.resolve.outputs.dry_run != 'true' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CLOUD_SIGN_ENV: ${{ secrets.WIN_CLOUD_SIGN_ENV }}
          WIN_CLOUD_SIGN_TOOL: ${{ vars.DESKTOP_WIN_CLOUD_SIGN_TOOL }}
          WIN_CLOUD_SIGN_ARGS: ${{ vars.DESKTOP_WIN_CLOUD_SIGN_ARGS }}
          WIN_PUBLISHER_NAME: ${{ vars.DESKTOP_WIN_PUBLISHER_NAME }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          missing_of() {
            local missing=""
            for name in "$@"; do
              [ -n "${!name:-}" ] || missing="$missing $name"
            done
            printf '%s' "$missing"
          }
          release=$(missing_of RELEASE_SIGNING_KEY)
          if [ -n "$release" ]; then
            echo "::error::SubKit Desktop is not released: RELEASE_SIGNING_KEY is not set in the repository settings. See apps/desktop/RELEASING.md. Nothing was built or published." >&2
            exit 1
          fi
          macos=$(missing_of CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          if [ "$WINDOWS_SIGNING" = "cloud" ]; then
            windows=$(missing_of WIN_CLOUD_SIGN_ENV WIN_CLOUD_SIGN_TOOL WIN_CLOUD_SIGN_ARGS WIN_PUBLISHER_NAME)
          else
            windows=$(missing_of WIN_CSC_LINK WIN_CSC_KEY_PASSWORD)
          fi
          if [ -n "$macos" ]; then
            echo "::warning::the macOS signing values are not set:$macos. This release ships without macOS. See apps/desktop/RELEASING.md."
            echo "macos=false" >> "$GITHUB_OUTPUT"
          else
            echo "macos=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$windows" ]; then
            echo "::warning::the Windows signing values are not set:$windows. This release ships without Windows. See apps/desktop/RELEASING.md."
            echo "windows=false" >> "$GITHUB_OUTPUT"
          else
            echo "windows=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$macos" ] && [ -n "$windows" ]; then
            echo "::error::SubKit Desktop is not released: neither the macOS nor the Windows signing values are set. Nothing was built or published." >&2
            exit 1
          fi

      - name: Require the published release without desktop artifacts
        if: ${{ steps.resolve.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh release view "$REQUESTED_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets) || { echo "::error::no release exists for $REQUESTED_TAG; this workflow never creates one" >&2; exit 1; }
          [ "$(jq -r '.isDraft' <<<"$release")" = "false" ] || { echo "::error::the release of $REQUESTED_TAG is still a draft" >&2; exit 1; }
          existing=$(jq -r '[.assets[].name | select(test("^(subkit-desktop-|latest(-mac)?\\.yml$|SHA256SUMS-desktop)"))] | join(" ")' <<<"$release")
          [ -z "$existing" ] || { echo "::error::the release of $REQUESTED_TAG already carries desktop artifacts: $existing" >&2; exit 1; }

  engine-darwin:
    needs: resolve
    if: ${{ needs.resolve.outputs.macos == 'true' }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      ENGINE_VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true

      - name: Build the engine for macOS
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build desktop-engine --target darwin-arm64
          ls -l dist/engine-desktop/mac/arm64/

      - name: Sign and notarize the macOS engine
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name:-}" ] || { echo "::error::missing macOS signing value $name" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/engine-signing.keychain-db"
          certificate="$RUNNER_TEMP/engine-signing.p12"
          key="$RUNNER_TEMP/notarization-key.p8"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate" "$key"' EXIT
          (umask 077 && printf '%s' "$CSC_LINK" | base64 --decode > "$certificate")
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          read -r -a keychains <<<"$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::CSC_LINK holds no Developer ID Application identity" >&2; exit 1; }
          export APPLE_API_KEY="$key"
          sh scripts/codesign-macos.sh dist/engine-desktop/mac/arm64/engine "$identity" apps/desktop/assets/entitlements.mac.plist
          sh scripts/notarize-macos.sh dist/engine-desktop/mac/arm64/engine

      - name: Verify the signatures and start the engine under the hardened runtime
        run: |
          set -euo pipefail
          engine=dist/engine-desktop/mac/arm64/engine
          if [ "$DRY_RUN" != "true" ]; then
            codesign --verify --strict --verbose=2 "$engine"
            details=$(codesign --display --verbose=4 "$engine" 2>&1)
            grep -q "^Authority=Developer ID Application: " <<<"$details" || { echo "::error::$engine is not signed with a Developer ID Application certificate" >&2; exit 1; }
            grep -Eq "^CodeDirectory .*flags=.*runtime" <<<"$details" || { echo "::error::$engine is not signed with the hardened runtime" >&2; exit 1; }
            spctl -a -t install -vv "$engine" 2>&1 | grep -q "^source=Notarized Developer ID" || { echo "::error::Gatekeeper does not see $engine as notarized" >&2; exit 1; }
          fi
          [ "$("$engine" --version)" = "$VERSION" ] || { echo "::error::$engine does not report version $VERSION" >&2; exit 1; }
          "$engine" --help > /dev/null
          "$engine" --smoke

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: engine-desktop-mac
          retention-days: 7
          if-no-files-found: error
          path: dist/engine-desktop/mac/

  engine-windows:
    needs: resolve
    if: ${{ needs.resolve.outputs.windows == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ENGINE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true

      - name: Build the engine for Windows
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build desktop-engine --target windows-x64
          ls -l dist/engine-desktop/win/x64/
          test -s dist/engine-desktop/win/THIRD_PARTY_NOTICES.engine.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: engine-desktop-win
          retention-days: 7
          if-no-files-found: error
          path: dist/engine-desktop/win/

  macos:
    needs: [resolve, engine-darwin]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true

      - name: Install the app toolchain and the runtime distribution
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          node node_modules/electron/install.js
          printf 'module.exports = async () => false;\n' > "$RUNNER_TEMP/before-build.cjs"

      - name: Stage the signed engine for local mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name engine-desktop-mac --dir dist/engine-desktop/mac
          chmod 755 dist/engine-desktop/mac/arm64/engine
          test "$(lipo -archs dist/engine-desktop/mac/arm64/engine)" = arm64
          test -s dist/engine-desktop/mac/THIRD_PARTY_NOTICES.engine.txt

      - name: Fetch PostgreSQL for local mode
        run: |
          set -euo pipefail
          bun run --cwd apps/desktop scripts/fetch-postgres.ts --target darwin-arm64
          test -x apps/desktop/resources/postgres/darwin-arm64/bin/postgres
          test -x apps/desktop/resources/postgres/darwin-arm64/bin/initdb

      - name: Fetch agent-desktop and agent-browser
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          bun run scripts/fetch-agent-desktop.ts
          bun run scripts/fetch-agent-browser.ts darwin-arm64
          test -x resources/agent-desktop/darwin-arm64/agent-desktop
          test -x resources/agent-desktop/darwin-arm64/agent-desktop-macos-helper
          test -x resources/agent-browser/darwin-arm64/agent-browser

      - name: Sign PostgreSQL, agent-desktop and agent-browser
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          postgres=apps/desktop/resources/postgres/darwin-arm64
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "::error::missing macOS signing value $name" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/postgres-signing.keychain-db"
          certificate="$RUNNER_TEMP/postgres-signing.p12"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate"' EXIT
          (umask 077 && printf '%s' "$CSC_LINK" | base64 --decode > "$certificate")
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          read -r -a keychains <<<"$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/"Developer ID Application: / { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::CSC_LINK holds no Developer ID Application identity" >&2; exit 1; }
          sh scripts/codesign-macos-folder.sh "$postgres" "$identity"
          bun run --cwd apps/desktop scripts/fetch-agent-desktop.ts --sign "$identity"
          sh scripts/codesign-macos-folder.sh apps/desktop/resources/agent-browser/darwin-arm64 "$identity"

      - name: Build, sign and notarize
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SUBKIT_DESKTOP_UPDATES: "1"
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name:-}" ] || { echo "::error::missing macOS signing value $name" >&2; exit 1; }
          done
          key="$RUNNER_TEMP/notarization-key.p8"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          export APPLE_API_KEY="$key"
          bun run package --prebuilt --mac --publish never -c.npmRebuild=true "-c.beforeBuild=$RUNNER_TEMP/before-build.cjs"

      - name: Build unsigned dry run
        if: ${{ needs.resolve.outputs.dry_run == 'true' }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SUBKIT_DESKTOP_UPDATES: "0"
        run: |
          set -euo pipefail
          bun run package --prebuilt --mac --publish never -c.mac.notarize=false -c.npmRebuild=true "-c.beforeBuild=$RUNNER_TEMP/before-build.cjs" -c.mac.identity=- -c.mac.hardenedRuntime=false

      - name: Check that the app carries the engine and PostgreSQL for local mode
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          resources=release/mac-arm64/SubKit.app/Contents/Resources
          for file in local/engine local/postgres/bin/postgres local/postgres/bin/initdb local/postgres/COPYRIGHT; do
            test -s "$resources/$file" || { echo "::error::the app lacks $file" >&2; exit 1; }
          done
          grep -q "LOCAL MODE: POSTGRESQL AND ITS LIBRARIES" "$resources/THIRD_PARTY_NOTICES.txt"
          grep -q "LOCAL MODE: SUBKIT ENGINE" "$resources/THIRD_PARTY_NOTICES.txt"
          test -x "$resources/agent-browser/agent-browser" || { echo "::error::the app lacks agent-browser" >&2; exit 1; }
          test -x "$resources/../Helpers/agent-desktop/agent-desktop" || { echo "::error::the app lacks agent-desktop" >&2; exit 1; }
          grep -Eq "^agent-browser [0-9.]+ \(Apache-2.0\)$" "$resources/THIRD_PARTY_NOTICES.txt"
          grep -Eq "^agent-desktop [0-9.]+ \(Apache-2.0\)$" "$resources/THIRD_PARTY_NOTICES.txt"
          "$resources/local/postgres/bin/postgres" --version
          "$resources/local/postgres/bin/initdb" --version

      - name: Verify the signature and launch the app
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          app=release/mac-arm64/SubKit.app
          codesign --verify --deep --strict --verbose=2 "$app"
          profile=$(mktemp -d)
          "$app/Contents/MacOS/SubKit" "--user-data-dir=$profile" > "$RUNNER_TEMP/launch.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 10); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            wait "$pid" || true
          else
            status=0
            wait "$pid" || status=$?
            [ "$status" -eq 0 ] || { cat "$RUNNER_TEMP/launch.log" >&2; echo "::error::$app exited with $status on launch" >&2; exit 1; }
          fi

      - name: Verify signature, Gatekeeper and notarization ticket
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          verify_app() {
            local app="$1"
            test -d "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            local details
            details=$(codesign --display --verbose=4 "$app" 2>&1)
            grep -q "^Authority=Developer ID Application: " <<<"$details" || { echo "::error::$app is not signed with a Developer ID Application certificate" >&2; exit 1; }
            grep -Eq "^CodeDirectory .*flags=.*runtime" <<<"$details" || { echo "::error::$app is not signed with the hardened runtime" >&2; exit 1; }
            spctl -a -t exec -vv "$app"
            xcrun stapler validate "$app"
            local engine="$app/Contents/Resources/local/engine"
            codesign --verify --strict --verbose=2 "$engine"
            codesign --display --verbose=4 "$engine" 2>&1 | grep -Eq "^CodeDirectory .*flags=.*runtime" || { echo "::error::$engine is not signed with the hardened runtime" >&2; exit 1; }
            codesign --display --entitlements - --xml "$engine" 2>/dev/null | grep -q "com.apple.security.cs.allow-jit" || { echo "::error::$engine lacks the JIT entitlement" >&2; exit 1; }
            [ "$("$engine" --version)" = "$VERSION" ] || { echo "::error::$engine does not start from the signed app" >&2; exit 1; }
            local postgres="$app/Contents/Resources/local/postgres"
            local file
            while IFS= read -r file; do
              case "$(file -b "$file")" in
                Mach-O*)
                  codesign --verify --strict "$file"
                  codesign --display --verbose=4 "$file" 2>&1 | grep -q "^Authority=Developer ID Application: " || { echo "::error::$file is not signed with a Developer ID Application certificate" >&2; exit 1; }
                  codesign --display --verbose=4 "$file" 2>&1 | grep -Eq "^CodeDirectory .*flags=.*runtime" || { echo "::error::$file is not signed with the hardened runtime" >&2; exit 1; }
                  ;;
              esac
            done < <(find "$postgres" "$app/Contents/Helpers/agent-desktop" "$app/Contents/Resources/agent-browser" -type f)
            "$postgres/bin/postgres" --version
            "$postgres/bin/initdb" --version
          }
          zips=(release/subkit-desktop-"$VERSION"-mac-*.zip)
          dmgs=(release/subkit-desktop-"$VERSION"-mac-*.dmg)
          [ "${#zips[@]}" -eq 1 ] && [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::expected one arm64 zip and one arm64 dmg" >&2; exit 1; }
          for zip in "${zips[@]}"; do
            unpacked=$(mktemp -d)
            ditto -x -k "$zip" "$unpacked"
            verify_app "$unpacked/SubKit.app"
            test -s "$unpacked/SubKit.app/Contents/Resources/THIRD_PARTY_NOTICES.txt"
            test -s "$unpacked/SubKit.app/Contents/Resources/LICENSES.chromium.html"
            rm -rf "$unpacked"
          done
          for dmg in "${dmgs[@]}"; do
            mount=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
            verify_app "$mount/SubKit.app"
            detached=false
            for _ in 1 2 3 4 5; do
              if hdiutil detach "$mount"; then detached=true; break; fi
              sleep 3
            done
            [ "$detached" = true ] || hdiutil detach -force "$mount"
          done

      - name: Stage artifacts
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          mkdir -p staged
          cp release/subkit-desktop-"$VERSION"-mac-* release/latest-mac.yml staged/
          cp dist/THIRD_PARTY_NOTICES.txt "staged/subkit-desktop-$VERSION-mac-THIRD_PARTY_NOTICES.txt"
          bun run scripts/verify-feed.ts staged "$VERSION" latest-mac.yml
          ls -l staged

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-macos
          retention-days: 7
          if-no-files-found: error
          path: apps/desktop/staged/

  windows:
    needs: [resolve, engine-windows]
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true

      - name: Install the app toolchain and the runtime distribution
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          node node_modules/electron/install.js
          printf 'module.exports = async () => false;\n' > "$RUNNER_TEMP/before-build.cjs"

      - name: Start the Windows engine on Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name engine-desktop-win --dir dist/engine-desktop/win
          engine=dist/engine-desktop/win/x64/engine.exe
          test -s dist/engine-desktop/win/THIRD_PARTY_NOTICES.engine.txt
          [ "$("$engine" --version | tr -d '\r')" = "$VERSION" ] || { echo "::error::$engine does not report version $VERSION" >&2; exit 1; }
          "$engine" --help > /dev/null
          "$engine" --smoke

      - name: Build and sign with the certificate
        if: ${{ needs.resolve.outputs.dry_run != 'true' && needs.resolve.outputs.windows_signing == 'certificate' }}
        working-directory: apps/desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SUBKIT_DESKTOP_UPDATES: "1"
        run: |
          set -euo pipefail
          for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "::error::missing Windows signing value $name" >&2; exit 1; }
          done
          bun run package --prebuilt --win --publish never -c.npmRebuild=true "-c.beforeBuild=$RUNNER_TEMP/before-build.cjs"

      - name: "Alternative, off by default: build and sign with a cloud signing service"
        if: ${{ needs.resolve.outputs.dry_run != 'true' && needs.resolve.outputs.windows_signing == 'cloud' }}
        working-directory: apps/desktop
        env:
          SUBKIT_DESKTOP_WIN_SIGNING: cloud
          WIN_CLOUD_SIGN_ENV: ${{ secrets.WIN_CLOUD_SIGN_ENV }}
          WIN_CLOUD_SIGN_TOOL: ${{ vars.DESKTOP_WIN_CLOUD_SIGN_TOOL }}
          WIN_CLOUD_SIGN_ARGS: ${{ vars.DESKTOP_WIN_CLOUD_SIGN_ARGS }}
          WIN_PUBLISHER_NAME: ${{ vars.DESKTOP_WIN_PUBLISHER_NAME }}
          SUBKIT_DESKTOP_UPDATES: "1"
        run: |
          set -euo pipefail
          for name in WIN_CLOUD_SIGN_ENV WIN_CLOUD_SIGN_TOOL WIN_CLOUD_SIGN_ARGS WIN_PUBLISHER_NAME; do
            [ -n "${!name:-}" ] || { echo "::error::missing Windows cloud signing value $name" >&2; exit 1; }
          done
          bun run package --prebuilt --win --publish never -c.npmRebuild=true "-c.beforeBuild=$RUNNER_TEMP/before-build.cjs" \
            "-c.win.signtoolOptions.sign=scripts/win-cloud-sign.cjs" \
            "-c.win.signtoolOptions.publisherName=$WIN_PUBLISHER_NAME"

      - name: Build unsigned dry run
        if: ${{ needs.resolve.outputs.dry_run == 'true' }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SUBKIT_DESKTOP_UPDATES: "0"
        run: |
          set -euo pipefail
          bun run package --prebuilt --win --publish never -c.npmRebuild=true "-c.beforeBuild=$RUNNER_TEMP/before-build.cjs"

      - name: Verify Authenticode signatures
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found on the runner" }
          $files = @("release\subkit-desktop-$env:VERSION-win-x64.exe", "release\win-unpacked\SubKit.exe")
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "$file is missing" }
            & $signtool.FullName verify /pa /all /v $file
            if ($LASTEXITCODE -ne 0) { throw "signtool could not verify $file" }
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne "Valid") { throw "$file has signature status $($signature.Status)" }
            if (-not $signature.TimeStamperCertificate) { throw "$file carries no trusted timestamp" }
          }
          $feed = Get-Content "release\win-unpacked\resources\app-update.yml" -Raw
          if ($feed -notmatch "(?m)^publisherName:") { throw "app-update.yml names no publisher, so updates would not be verified" }

      - name: Stage artifacts
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          mkdir -p staged
          cp release/subkit-desktop-"$VERSION"-win-* release/latest.yml staged/
          cp dist/THIRD_PARTY_NOTICES.txt "staged/subkit-desktop-$VERSION-win-THIRD_PARTY_NOTICES.txt"
          bun run scripts/verify-feed.ts staged "$VERSION" latest.yml
          ls -l staged

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows
          retention-days: 7
          if-no-files-found: error
          path: apps/desktop/staged/

  publish:
    needs: [resolve, macos, windows]
    if: ${{ !cancelled() && needs.resolve.outputs.dry_run != 'true' && (needs.macos.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true

      - name: Collect the artifacts of this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/desktop-artifacts"
          assets="$RUNNER_TEMP/desktop-assets"
          rm -rf "$download" "$assets"
          mkdir -p "$download" "$assets"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$download"
          names=""
          feeds=""
          if [ "$MACOS_RESULT" = "success" ]; then
            names="$names desktop-macos"
            feeds="$feeds latest-mac.yml"
          else
            echo "::warning::the macOS build ended with $MACOS_RESULT; this release ships without macOS"
          fi
          if [ "$WINDOWS_RESULT" = "success" ]; then
            names="$names desktop-windows"
            feeds="$feeds latest.yml"
          else
            echo "::warning::the Windows build ended with $WINDOWS_RESULT; this release ships without Windows"
          fi
          for name in $names; do
            test -d "$download/$name"
            for file in "$download/$name"/*; do
              test -f "$file"
              test ! -e "$assets/$(basename "$file")"
              cp "$file" "$assets/"
            done
          done
          dmg="$assets/subkit-desktop-$VERSION-mac-arm64.dmg"
          [ ! -f "$dmg" ] || mv "$dmg" "$assets/subkit-desktop-mac-arm64.dmg"
          exe="$assets/subkit-desktop-$VERSION-win-x64.exe"
          [ ! -f "$exe" ] || cp "$exe" "$assets/subkit-desktop-win-x64.exe"
          test ! -e "$dmg"
          if compgen -G "$assets/*.dmg.blockmap" > /dev/null; then echo "::error::a DMG block map was built; the DMG is a download only" >&2; exit 1; fi
          [ "$MACOS_RESULT" != "success" ] || test -f "$assets/subkit-desktop-mac-arm64.dmg"
          [ "$WINDOWS_RESULT" != "success" ] || test -f "$assets/subkit-desktop-win-x64.exe"
          echo "ASSETS_DIR=$assets" >> "$GITHUB_ENV"
          echo "FEEDS=$feeds" >> "$GITHUB_ENV"

      - name: Verify the update feeds against the artifacts
        run: bun run apps/desktop/scripts/verify-feed.ts "$ASSETS_DIR" "$VERSION" $FEEDS

      - name: Write and sign desktop checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_SIGNING_KEY:-}"
          (cd "$ASSETS_DIR" && sha256sum subkit-desktop-* latest*.yml > SHA256SUMS-desktop && cat SHA256SUMS-desktop)
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$ASSETS_DIR/SHA256SUMS-desktop" -out "$ASSETS_DIR/SHA256SUMS-desktop.sig"

      - name: Verify signature against the updater trust root
        run: |
          bun -e 'import { verify } from "node:crypto"; import { readFileSync } from "node:fs"; import { RELEASE_PUBLIC_KEY } from "./packages/cli-core/src/release-public-key.ts"; const dir = process.env.ASSETS_DIR; if (!dir || !verify(null, readFileSync(`${dir}/SHA256SUMS-desktop`), RELEASE_PUBLIC_KEY, readFileSync(`${dir}/SHA256SUMS-desktop.sig`))) throw new Error("desktop checksum signature does not match the updater public key");'

      - name: Add the artifacts to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "false" ] || { echo "::error::no published release exists for $TAG; this workflow never creates one" >&2; exit 1; }
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ASSETS_DIR"/subkit-desktop-* "$ASSETS_DIR/SHA256SUMS-desktop" "$ASSETS_DIR/SHA256SUMS-desktop.sig"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ASSETS_DIR"/latest*.yml

      - name: Download and verify the published desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/desktop-published"
          rm -rf "$download"
          mkdir -p "$download"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$download" --pattern 'subkit-desktop-*' --pattern 'latest*.yml' --pattern 'SHA256SUMS-desktop*'
          (cd "$download" && sha256sum --strict --check SHA256SUMS-desktop)
          RELEASE_DOWNLOAD_DIR="$download" bun -e 'import { verify } from "node:crypto"; import { readFileSync } from "node:fs"; import { RELEASE_PUBLIC_KEY } from "./packages/cli-core/src/release-public-key.ts"; const dir = process.env.RELEASE_DOWNLOAD_DIR; if (!dir || !verify(null, readFileSync(`${dir}/SHA256SUMS-desktop`), RELEASE_PUBLIC_KEY, readFileSync(`${dir}/SHA256SUMS-desktop.sig`))) throw new Error("downloaded desktop checksum signature does not match the updater public key");'
          bun run apps/desktop/scripts/verify-feed.ts "$download" "$VERSION" $FEEDS

  # release.yml publishes a release without marking it latest. This job marks it latest once the
  # desktop assets are attached, so releases/latest/download/latest-mac.yml and the DMG link never
  # point at a release without them. When the desktop build failed or was skipped it fails and
  # leaves the previous release latest; rerun desktop-release for the tag to promote it.
  promote:
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.resolve.outputs.dry_run != 'true' && ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && !inputs.unsigned_dry_run)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mark the release latest
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a release tag; the latest release stays as it is"
            exit 0
          fi
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets) || { echo "::warning::no release exists for $TAG; the latest release stays as it is"; exit 0; }
          if [ "$(jq -r '.isDraft or .isPrerelease' <<<"$release")" = "true" ]; then
            echo "::notice::the release of $TAG is a draft or a prerelease; the latest release stays as it is"
            exit 0
          fi
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "::notice::$newest is newer than $TAG; the latest release stays as it is"
            exit 0
          fi
          missing=""
          for asset in latest-mac.yml subkit-desktop-mac-arm64.dmg; do
            jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' <<<"$release" > /dev/null || missing="$missing $asset"
          done
          if [ -n "$missing" ]; then
            echo "::error::$TAG stays unpromoted, it lacks SubKit Desktop assets:$missing (desktop publish: ${PUBLISH_RESULT:-skipped}). The previous release stays latest until desktop-release runs again for $TAG. See apps/desktop/RELEASING.md." >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          [ "$latest" = "$TAG" ] || { echo "::error::GitHub reports $latest as the latest release, expected $TAG" >&2; exit 1; }
          echo "$TAG is the latest release"
