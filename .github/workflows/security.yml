name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never cancel a running scan: a cancelled CodeQL job uploads a failed analysis
# and GitHub then reports a code scanning configuration error. Queued runs are
# still superseded by newer pushes, so only the latest pending commit waits.
# Pull requests run Semgrep and scan only their own commits for secrets, so every merged change carries a code scanning result.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  codeql:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript, actions
          config-file: .github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          upload: always
          output: ${{ runner.temp }}/codeql

      - name: Fail on findings
        run: |
          set -euo pipefail
          count=$(jq -s '[.[].runs[].results[]] | length' "$RUNNER_TEMP"/codeql/*.sarif)
          jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' "$RUNNER_TEMP"/codeql/*.sarif
          [ "$count" -eq 0 ] || { echo "::error::CodeQL found $count issues" >&2; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: codeql-sarif
          retention-days: 30
          if-no-files-found: ignore
          path: ${{ runner.temp }}/codeql/

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: pipx install semgrep==1.184.0

      - name: Scan
        id: scan
        run: bash scripts/semgrep.sh --sarif-output="$RUNNER_TEMP/semgrep.sarif"

      # A transient upload error leaves the commit without a code scanning check run,
      # which Scorecard's SAST check counts as unscanned. Retry the upload once.
      - id: upload
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep

      - name: Wait before retrying the upload
        if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
        run: sleep 30

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
      AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --strict --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the pushed commits
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="$range"
