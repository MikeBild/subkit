name: release-please

# Manual-only. Many small commits land on main via the regular CI
# gate; release-please runs only when the operator decides it's time
# to cut the next version. Trigger via:
#   gh workflow run release-please.yml
# Restore push-on-main triggering by uncommenting the block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # If a PAT is set as `RELEASE_PLEASE_TOKEN`, use it so the
          # tag/release it creates fire downstream workflows (the
          # `release` workflow builds binaries + publishes). Without
          # the PAT we fall back to GITHUB_TOKEN and downstream must
          # be kicked off manually via
          # `gh workflow run release.yml --ref <tag>` — GitHub's
          # no-recursion policy suppresses chain-triggers from
          # GITHUB_TOKEN events.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
