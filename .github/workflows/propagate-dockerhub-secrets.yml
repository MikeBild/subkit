name: Propagate Docker Hub publishing secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  propagate:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy publishing credentials to product repositories
        env:
          GH_TOKEN: ${{ secrets.SUBKIT_DEPLOY_DISPATCH_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          for repository in contentkit wikikit watchkit workkit codekit; do
            printf '%s' "$DOCKERHUB_USERNAME" \
              | gh secret set DOCKERHUB_USERNAME --repo "MikeBild/$repository"
            printf '%s' "$DOCKERHUB_TOKEN" \
              | gh secret set DOCKERHUB_TOKEN --repo "MikeBild/$repository"
          done
