name: windows
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/install.ps1"
      - "packages/cli-core/src/**"
      - "apps/subkit/src/**"
      - "apps/engine/src/speech/**"
      - "apps/cockpit/src/features/voice/**"
      - "apps/desktop/src/shared/**"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "scripts/install.ps1"
      - "packages/cli-core/src/**"
      - "apps/subkit/src/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LLM_PROVIDER: mock
  SKIP_DOCKER: "1"

jobs:
  unit:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            bun install --frozen-lockfile --ignore-scripts
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 20
          }
          exit 1
      - name: Platform-neutral units on Windows
        shell: pwsh
        run: >-
          bun test
          packages/cli-core/src/voice
          apps/subkit/src/ink-app/dictation-state.test.ts
          apps/engine/src/speech/core
          apps/cockpit/src/features/voice
          apps/desktop/src/shared/permission-policy.test.ts

  installer:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: The installer parses
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: The installer refuses an administrator shell
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/install.ps1 *> refusal.txt
          if ($LASTEXITCODE -eq 0) { Write-Error "the installer ran from an administrator shell"; exit 1 }
          if (-not (Select-String -Path refusal.txt -Pattern "administrator shell" -Quiet)) { Get-Content refusal.txt; exit 1 }
      - name: The installer installs the latest release for the current user
        shell: pwsh
        env:
          SUBKIT_ALLOW_ELEVATED: "1"
          SUBKIT_INSTALL_DIR: ${{ runner.temp }}\subkit-bin
        run: |
          pwsh -NoProfile -File scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & "$env:SUBKIT_INSTALL_DIR\subkit.exe" --version
          if ($LASTEXITCODE -ne 0 -or -not $version) { Write-Error "subkit.exe did not start"; exit 1 }
          Write-Host "installed $version"
          foreach ($notice in "subkit.LICENSE", "subkit.THIRD_PARTY_NOTICES.txt") {
            if (-not (Test-Path "$env:SUBKIT_INSTALL_DIR\$notice")) { Write-Error "missing $notice"; exit 1 }
          }
