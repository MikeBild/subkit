name: commitlint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job key MUST be `commitlint` — branch protection on `main` requires a
  # check-run literally named `commitlint`. A renamed job name (e.g. `lint`)
  # produces a `lint` check-run that branch protection won't see, blocking
  # all merges with a phantom missing required check.
  commitlint:
    # Dependabot titles are conventional already; its auto-generated PR
    # bodies blow the body-max-line-length rule with changelog tables.
    # A skipped job still satisfies the required check, so protection holds.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
