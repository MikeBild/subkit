name: claude-review

# Runs the project's /review slash command (defined at .claude/commands/review.md
# and routed to the domain-architect sub-agent at .claude/agents/domain-architect.md)
# against the PR diff and posts a single summary comment.
#
# Trust boundary: the model's stdout is captured and piped through
# `apps/engine/scripts/scrub-review-comment.ts` (which reuses the
# `scrubString` patterns from `packages/shared/src/redaction.ts`)
# BEFORE the comment is posted via `gh pr comment`. A model that
# echoes a diff-embedded secret cannot leak it to a public PR thread.
#
# Advisory only — workflow always exits 0. Humans triage the findings.
#
# Cost guards:
#   * skipped on docs-only PRs (paths-ignore)
#   * skipped on drafts
#   * skipped on PRs from forks (secrets aren't available there anyway)
#   * skipped if the PR title contains "[skip-review]"
#   * --max-budget-usd 1.00 caps API spend per run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-24.04
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.title, '[skip-review]')
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Claude Code CLI
        run: bun add -g @anthropic-ai/claude-code

      - name: Run /review and capture raw output
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # The slash-command file starts with `---\n…\n---` YAML
          # frontmatter; passing it verbatim to `claude --print` makes
          # the CLI parse `---` as a flag. Strip the leading
          # frontmatter (only when it sits at line 1) and pass the
          # body as a positional argument.
          awk '
            BEGIN { in_fm = 0 }
            NR == 1 && /^---[[:space:]]*$/ { in_fm = 1; next }
            in_fm && /^---[[:space:]]*$/ { in_fm = 0; next }
            in_fm { next }
            { print }
          ' .claude/commands/review.md > review-prompt.md
          test -s review-prompt.md
          PROMPT="$(cat review-prompt.md)"
          # `--bare` forces strict ANTHROPIC_API_KEY auth (no OAuth /
          # keychain reads — neither exists in CI). `-p` is the
          # non-interactive print mode. `--dangerously-skip-permissions`
          # skips the approval prompts the agent would otherwise wait
          # for. `--max-budget-usd` caps spend per run (the action's
          # equivalent of `max_turns: 8` is dollar-denominated when
          # invoked from the CLI).
          claude --bare \
                 --dangerously-skip-permissions \
                 --max-budget-usd 1.00 \
                 -p "$PROMPT" \
                 > review-raw.md

      - name: Scrub secrets from review body
        run: |
          set -euo pipefail
          bun run apps/engine/scripts/scrub-review-comment.ts \
            < review-raw.md > review-scrubbed.md
          # Sanity-floor: an empty body would be silently ignored by
          # `gh pr comment`; the model returning nothing is a real
          # failure mode worth surfacing.
          test -s review-scrubbed.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file review-scrubbed.md
        # Advisory only — the workflow's contract (see header) is to
        # never block merges on review-content findings. With redaction
        # in front of the comment-post, any model output is safe to ship.
        continue-on-error: true
