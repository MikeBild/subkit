name: claude-review

# Runs the project's /review slash command (defined at .claude/commands/review.md
# and routed to the domain-architect sub-agent at .claude/agents/domain-architect.md)
# against the PR diff and posts a single summary comment.
#
# Advisory only — workflow always exits 0. Humans triage the findings.
#
# Cost guards:
#   * skipped on docs-only PRs (paths-ignore)
#   * skipped on drafts
#   * skipped on PRs from forks (secrets aren't available there anyway)
#   * skipped if the PR title contains "[skip-review]"
#   * --max-turns 8 caps API spend per run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-24.04
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.title, '[skip-review]')
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run /review
        uses: anthropics/claude-code-action@beta
        with:
          # Action expects `direct_prompt` and `max_turns` — the previous
          # `prompt` / `claude_args` keys produced an "Unexpected input(s)"
          # warning and were silently ignored.
          direct_prompt: /review
          max_turns: 8
          # Anthropic API key is consumed as a `with:` input, not from
          # the `env:` block. Passing it via env produces
          # "Environment variable validation failed: Either
          # ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN is required"
          # at runtime — the action validates the input, not the env.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow's default GITHUB_TOKEN (already scoped to
          # `pull-requests: write` above) to post comments. Without this,
          # the action falls back to OIDC → installation-token, which
          # requires the Anthropic GitHub App to be installed on the
          # repo and returns "Bad credentials" 401 otherwise.
          github_token: ${{ secrets.GITHUB_TOKEN }}
        # Advisory only — the workflow's contract (see header) is to
        # never block merges on review-content findings. With OIDC
        # permissions and inputs now correct, the only remaining reasons
        # for a failure would be Anthropic API outages or rate limits;
        # those should surface in the run log, not as a red required check.
        continue-on-error: true
