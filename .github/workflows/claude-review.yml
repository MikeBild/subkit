name: claude-review

# Runs the project's /review slash command (defined at .claude/commands/review.md
# and routed to the domain-architect sub-agent at .claude/agents/domain-architect.md)
# against the PR diff and posts a single summary comment.
#
# Trust boundary: the model's stdout is captured and piped through
# `apps/engine/scripts/scrub-review-comment.ts` (which reuses the
# `scrubString` patterns from `packages/shared/src/redaction.ts`)
# BEFORE the comment is posted via `gh pr comment`. A model that
# echoes a diff-embedded secret cannot leak it to a public PR thread.
#
# Advisory only — the WORKFLOW always exits 0. Humans triage the
# findings, and a missing review never blocks a merge.
#
# Stability contract: every step is wrapped so it cannot fail the
# job. The model can run out of budget, time out, or refuse to
# respond — the workflow still posts whatever it managed to capture
# (or skips posting silently). Per the "advisory only" header above,
# the only things that should fail this job are config bugs in the
# workflow YAML itself.
#
# Cost guards:
#   * skipped on docs-only PRs (paths-ignore)
#   * skipped on drafts
#   * skipped on PRs from forks (secrets aren't available there anyway)
#   * skipped if the PR title contains "[skip-review]"
#   * --max-budget-usd 5.00 caps API spend per run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-24.04
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.title, '[skip-review]')
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Claude Code CLI
        run: bun add -g @anthropic-ai/claude-code

      - name: Run /review and capture raw output
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Defense in depth: `--dangerously-skip-permissions` lets
          # the agent read/write inside $GITHUB_WORKSPACE; explicitly
          # clear the GitHub tokens so a hypothetical agent shell-out
          # cannot reach the gh API for this step. The Post step
          # below still has `GH_TOKEN` set for the actual comment.
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        # `set +e` (the shell default for this script) — claude can
        # exit non-zero (budget exhaustion, timeout, refusal) and we
        # explicitly do not want that to fail the job. Whatever
        # output landed in review-raw.md is what gets posted; an
        # empty file means we skip the post step gracefully.
        run: |
          # Strip the slash-command file's leading YAML frontmatter
          # (`---\n…\n---`) so the CLI doesn't parse `---` as a flag.
          awk '
            BEGIN { in_fm = 0 }
            NR == 1 && /^---[[:space:]]*$/ { in_fm = 1; next }
            in_fm && /^---[[:space:]]*$/ { in_fm = 0; next }
            in_fm { next }
            { print }
          ' .claude/commands/review.md > review-prompt.md
          if [ ! -s review-prompt.md ]; then
            echo "::warning::review-prompt.md is empty after frontmatter strip; skipping review"
            : > review-raw.md
            exit 0
          fi
          PROMPT="$(cat review-prompt.md)"
          # `--bare` forces strict ANTHROPIC_API_KEY auth (no OAuth /
          # keychain reads — neither exists in CI). `-p` is the
          # non-interactive print mode. `--dangerously-skip-permissions`
          # skips the approval prompts the agent would otherwise wait
          # for. `--max-budget-usd 5.00` caps spend per run; large
          # diffs can blow past $1 with sonnet-class context.
          set +e
          claude --bare \
                 --dangerously-skip-permissions \
                 --max-budget-usd 5.00 \
                 -p "$PROMPT" \
                 > review-raw.md
          exit_code=$?
          set -e
          if [ $exit_code -ne 0 ]; then
            echo "::warning::claude CLI exited $exit_code; posting whatever output landed (advisory only)"
          fi
          # Always succeed — see "Stability contract" in the header.
          exit 0

      - name: Scrub secrets from review body
        # The scrubber is a deterministic regex pass over stdin; the
        # only failure modes are empty-stdin (the scrubber refuses)
        # and a bug in the scrubber itself (which the unit tests
        # cover). Fail closed — if the scrub step fails, post a
        # diagnostic placeholder rather than the raw model output.
        # Posting raw output on scrub failure would defeat the
        # workflow's documented trust boundary ("a model that
        # echoes a diff-embedded secret cannot leak it to a public
        # PR thread"); a transient scrubber crash must never trade
        # against that contract.
        run: |
          set +e
          bun run apps/engine/scripts/scrub-review-comment.ts \
            < review-raw.md > review-scrubbed.md
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            # ::error:: surfaces the scrubber crash on the workflow's
            # summary page so a silent degradation to the placeholder
            # body is visible to operators, not buried in the log.
            # The job still exits 0 (advisory contract); the error
            # annotation just makes the failure noticeable.
            echo "::error title=scrub-review-comment crashed::scrub step failed (rc=$rc); model output suppressed for safety — review the run log and verify scrub-review-comment.ts"
            printf '%s\n' \
              '_claude-review: scrub step failed (rc='"$rc"'); model output suppressed for safety. See workflow logs._' \
              > review-scrubbed.md
          fi
          exit 0

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Skip posting on empty output rather than calling `gh` with
        # an empty body (which `gh` rejects). `continue-on-error`
        # remains as a belt for any unexpected gh failure.
        run: |
          if [ ! -s review-scrubbed.md ]; then
            echo "::notice::review body is empty; nothing to post"
            exit 0
          fi
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file review-scrubbed.md
        continue-on-error: true
