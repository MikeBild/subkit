name: claude-review

# Runs the project's /review slash command (defined at .claude/commands/review.md
# and routed to the domain-architect sub-agent at .claude/agents/domain-architect.md)
# against the PR diff and posts a single summary comment.
#
# Advisory only — workflow always exits 0. Humans triage the findings.
#
# Cost guards:
#   * skipped on docs-only PRs (paths-ignore)
#   * skipped on drafts
#   * skipped on PRs from forks (secrets aren't available there anyway)
#   * skipped if the PR title contains "[skip-review]"
#   * --max-turns 8 caps API spend per run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read
  pull-requests: write
  # `anthropics/claude-code-action` mints a GitHub App installation token
  # via OIDC (`getOidcToken()` in src/github/token.ts) so it can post the
  # review comment under the action's bot identity. Without this, the
  # token-fetch retries 3× then fails — and `continue-on-error: true`
  # silently swallows the failure as success, producing no comment.
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-24.04
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.title, '[skip-review]')
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run /review
        uses: anthropics/claude-code-action@beta
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          # Action expects `direct_prompt` and `max_turns` — the previous
          # `prompt` / `claude_args` keys produced an "Unexpected input(s)"
          # warning and were silently ignored.
          direct_prompt: /review
          max_turns: 8
        # Advisory only — the workflow's contract (see header) is to
        # never block merges on review-content findings. With OIDC
        # permissions and inputs now correct, the only remaining reasons
        # for a failure would be Anthropic API outages or rate limits;
        # those should surface in the run log, not as a red required check.
        continue-on-error: true
