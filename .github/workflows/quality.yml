name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  coverage-and-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: subkit
          POSTGRES_PASSWORD: subkit-test
          POSTGRES_DB: subkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subkit -d subkit"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://subkit:subkit-test@127.0.0.1:5432/subkit
      SUBKIT_COVERAGE_OWNED_DATABASE_URL: postgres://subkit:subkit-test@127.0.0.1:5432/subkit
      SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build:clipper
      - run: bun run verify:quality:release-shards
      - name: Retain complete shard quality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-shard-evidence
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: reports/quality-export/shards/
