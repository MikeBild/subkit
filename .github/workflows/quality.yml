name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: subkit
          POSTGRES_PASSWORD: subkit-test
          POSTGRES_DB: subkit
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U subkit -d subkit"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://subkit:subkit-test@127.0.0.1:5432/subkit
      SUBKIT_COVERAGE_OWNED_DATABASE_URL: postgres://subkit:subkit-test@127.0.0.1:5432/subkit
      SKIP_DOCKER: "1"
      LLM_PROVIDER: mock
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
      SUBKIT_QUALITY_HERMETIC_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: bun scripts/fetch-embedding-assets.ts
      - run: bun run build:clipper
      - run: bun run build:cockpit
      - run: bun run build:sk
      - run: bun run check:coverage-floor
      - name: Retain global coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-floor-evidence
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
          path: reports/coverage/
      - id: prepare
        run: bun run apps/engine/scripts/distributed-quality.ts prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-coordinator
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
          path: reports/distributed-quality/coordinator/
      - name: Retain failed quality diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-failure-coordinator
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .artifacts/goal-verification/runs/
            reports/quality-inputs/
            reports/coverage/shards/
            reports/mutation/runs/
  shard:
    needs: coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.coordinator.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: subkit
          POSTGRES_PASSWORD: subkit-test
          POSTGRES_DB: subkit
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U subkit -d subkit"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://subkit:subkit-test@127.0.0.1:5432/subkit
      SUBKIT_COVERAGE_OWNED_DATABASE_URL: postgres://subkit:subkit-test@127.0.0.1:5432/subkit
      SKIP_DOCKER: "1"
      LLM_PROVIDER: mock
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
      SUBKIT_QUALITY_HERMETIC_CI: "1"
      SUBKIT_QUALITY_COMMIT: ${{ needs.coordinator.outputs.commit }}
      SUBKIT_QUALITY_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.coordinator.outputs.commit }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: bun scripts/fetch-embedding-assets.ts
      - run: bun run build:clipper
      - run: bun run build:cockpit
      - run: bun run build:sk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quality-coordinator
          path: reports/distributed-quality/coordinator/
      - run: bun run apps/engine/scripts/distributed-quality.ts coverage
      - run: bun run apps/engine/scripts/distributed-quality.ts mutation
      - name: Retain native shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-shard-${{ matrix.shard }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
          path: reports/distributed-quality/shard/
      - name: Retain failed quality diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-failure-${{ matrix.shard }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .artifacts/goal-verification/runs/
            reports/quality-inputs/
            reports/coverage/shards/
            reports/mutation/runs/
  coverage-and-mutation:
    needs: [coordinator, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: subkit
          POSTGRES_PASSWORD: subkit-test
          POSTGRES_DB: subkit
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U subkit -d subkit"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://subkit:subkit-test@127.0.0.1:5432/subkit
      SUBKIT_COVERAGE_OWNED_DATABASE_URL: postgres://subkit:subkit-test@127.0.0.1:5432/subkit
      SKIP_DOCKER: "1"
      LLM_PROVIDER: mock
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
      SUBKIT_QUALITY_HERMETIC_CI: "1"
      SUBKIT_QUALITY_COMMIT: ${{ needs.coordinator.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.coordinator.outputs.commit }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build:clipper
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quality-coordinator
          path: reports/distributed-quality/coordinator/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: quality-shard-*
          path: reports/distributed-quality/downloads/
      - run: bun run apps/engine/scripts/distributed-quality.ts merge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-shard-evidence
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
          path: reports/quality-export/shards/
      - name: Retain failed quality diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-failure-merge
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .artifacts/goal-verification/runs/
            reports/quality-inputs/
            reports/coverage/shards/
            reports/mutation/runs/
