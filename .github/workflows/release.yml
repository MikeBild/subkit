name: release

on:
  # Triggered by:
  #   - `git push origin <tag>` (human or CI tagging)
  #   - release-please's tag push when RELEASE_PLEASE_TOKEN (a PAT, not
  #     GITHUB_TOKEN) is configured — only a non-GITHUB_TOKEN push bypasses
  #     GitHub's recursion guard and fires downstream workflows.
  #
  # We intentionally do NOT listen on `release: published` — having both
  # triggers causes the workflow to fan out twice for the same tag when
  # release-please creates the tag AND publishes the release in one step.
  push:
    tags: ['v*.*.*', 'subkit-v*.*.*']
  # Manual recovery — two modes:
  #   1. `gh workflow run release.yml --ref <tag>` — dispatch IS the tag;
  #      github.ref becomes the tag ref and the workflow runs as if the
  #      tag were just pushed. Uses the workflow file AT THAT TAG.
  #   2. `gh workflow run release.yml --ref main -f tag=<tag>` — runs
  #      the CURRENT main's workflow file but checks out `<tag>` for the
  #      build + attaches assets to that tag's release. Use this when a
  #      past tag's workflow file is broken (e.g. stuck macos-13 runners)
  #      and you need main's fixes.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build+release against (leave blank to use github.ref)"
        required: false
        default: ""

permissions:
  contents: write
  # `gh run download` in publish-release reads artifacts produced by
  # earlier jobs of the same run — requires `actions: read`.
  # The `gate` job dispatches ci.yml when no green run exists for the
  # release SHA (`gh workflow run`); that needs `actions: write`. Without
  # it the dispatch fails with HTTP 403 (Resource not accessible by
  # integration) and the gate times out — releases stall even when
  # ci.yml would have passed.
  actions: write

# Only one release workflow per tag can run at a time — guards against
# accidental double-fires (e.g. a retag) overwriting each other in DOCR
# or racing the droplet deploy.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com

jobs:
  # The release gate is the SAME `ci.yml / build` job that protects `main`.
  # We don't duplicate steps here. Two paths:
  #
  #  1. Tag points at a SHA that already has a green `ci / build` run →
  #     skip the gate, save ~7 min per release.
  #  2. Tag points at a SHA without a green run (e.g. retag, manual
  #     dispatch with --ref main while ci is mid-flight) → invoke the
  #     full ci.yml workflow on that SHA via `gh workflow run` and wait
  #     on it.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve tag SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require green ci.yml on this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
          # GitHub's `gh workflow run --ref` requires a branch or tag
          # name; raw SHAs return HTTP 422 "No ref found". Pass the tag
          # we're releasing (the workflow_dispatch ref or the inputs.tag
          # override) so the dispatch resolves correctly.
          DISPATCH_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Look for a successful run of ci.yml against this exact SHA.
          status=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$SHA" \
            --limit 5 \
            --json conclusion,status \
            --jq 'map(select(.status=="completed")) | .[0].conclusion // ""')
          if [ "$status" = "success" ]; then
            echo "ci.yml is already green on $SHA — gate passes."
            exit 0
          fi
          echo "No green ci.yml run for $SHA (status='$status'); dispatching one against ref=$DISPATCH_REF and waiting."
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$DISPATCH_REF"
          # Wait up to 30 min for the dispatched run to finish.
          deadline=$(( $(date +%s) + 1800 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 30
            row=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$SHA" \
              --limit 1 \
              --json conclusion,status,databaseId \
              --jq '.[0]')
            if [ -z "$row" ] || [ "$row" = "null" ]; then continue; fi
            st=$(echo "$row" | jq -r '.status')
            if [ "$st" = "completed" ]; then
              cc=$(echo "$row" | jq -r '.conclusion')
              if [ "$cc" = "success" ]; then
                echo "ci.yml dispatched run completed: success"
                exit 0
              fi
              echo "ci.yml dispatched run completed: $cc — failing release gate."
              exit 1
            fi
          done
          echo "Timed out waiting for ci.yml run on $SHA."
          exit 1

  # ── Multi-platform CLI binaries ──

  build-cli-binaries:
    name: build ${{ matrix.binary }}-${{ matrix.os }}-${{ matrix.arch }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Using `include` only (no base dimensions) so every listed
        # combination produces exactly one job. A previous base
        # `binary: [...]` dimension made GitHub Actions merge each
        # base entry with the LAST matching include, silently dropping
        # every non-windows build. See git log for the fix.
        include:
          # darwin-arm64
          - binary: sk
            os: darwin
            arch: arm64
            runner: macos-14
            target: ""
            entry: apps/sk/src/index.ts
          - binary: tunnel-agent
            os: darwin
            arch: arm64
            runner: macos-14
            target: ""
            entry: apps/agent/src/index.ts
          - binary: engine
            os: darwin
            arch: arm64
            runner: macos-14
            target: ""
            entry: apps/engine/src/index.ts
          # darwin-x64 (cross-compiled from macos-14 arm64; macos-13
          # runners queue for 20+ min and are slated for GitHub
          # deprecation. Ad-hoc codesign (`--sign -`) works cross-arch.)
          - binary: sk
            os: darwin
            arch: x64
            runner: macos-14
            target: bun-darwin-x64
            entry: apps/sk/src/index.ts
          - binary: tunnel-agent
            os: darwin
            arch: x64
            runner: macos-14
            target: bun-darwin-x64
            entry: apps/agent/src/index.ts
          - binary: engine
            os: darwin
            arch: x64
            runner: macos-14
            target: bun-darwin-x64
            entry: apps/engine/src/index.ts
          # linux-x64
          - binary: sk
            os: linux
            arch: x64
            runner: ubuntu-latest
            target: ""
            entry: apps/sk/src/index.ts
          - binary: tunnel-agent
            os: linux
            arch: x64
            runner: ubuntu-latest
            target: ""
            entry: apps/agent/src/index.ts
          - binary: engine
            os: linux
            arch: x64
            runner: ubuntu-latest
            target: ""
            entry: apps/engine/src/index.ts
          # linux-arm64 (cross-compiled from x64)
          - binary: sk
            os: linux
            arch: arm64
            runner: ubuntu-latest
            target: bun-linux-arm64
            entry: apps/sk/src/index.ts
          - binary: tunnel-agent
            os: linux
            arch: arm64
            runner: ubuntu-latest
            target: bun-linux-arm64
            entry: apps/agent/src/index.ts
          - binary: engine
            os: linux
            arch: arm64
            runner: ubuntu-latest
            target: bun-linux-arm64
            entry: apps/engine/src/index.ts
          # windows-x64 (cross-compiled from linux-x64 — windows-latest
          # runners spend 5–8 min per binary on NTFS small-file I/O +
          # Defender scanning during `bun install` and `bun build
          # --compile`. Cross-compile stamps the same Bun-windows runtime
          # in ~30 s on a Linux runner.)
          - binary: sk
            os: windows
            arch: x64
            runner: ubuntu-latest
            target: bun-windows-x64
            entry: apps/sk/src/index.ts
          - binary: tunnel-agent
            os: windows
            arch: x64
            runner: ubuntu-latest
            target: bun-windows-x64
            entry: apps/agent/src/index.ts
          - binary: engine
            os: windows
            arch: x64
            runner: ubuntu-latest
            target: bun-windows-x64
            entry: apps/engine/src/index.ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          # See bun-version comment in the `test` job above.
          bun-version: 1.3.12
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      - name: Compile binary
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_REF#subkit-v}"
          VERSION="${VERSION#v}"
          EXT=""
          TARGET_FLAG=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi
          if [ -n "${{ matrix.target }}" ]; then
            TARGET_FLAG="--target=${{ matrix.target }}"
          fi
          OUT="${{ matrix.binary }}_${{ matrix.os }}_${{ matrix.arch }}${EXT}"
          mkdir -p dist
          bun build "${{ matrix.entry }}" \
            --compile \
            $TARGET_FLAG \
            --define "BUILD_VERSION=\"$VERSION\"" \
            --outfile "dist/$OUT"

      - name: macOS codesign
        if: matrix.os == 'darwin'
        run: |
          BINARY="dist/${{ matrix.binary }}_${{ matrix.os }}_${{ matrix.arch }}"
          codesign --remove-signature "$BINARY" 2>/dev/null || true
          codesign --sign - --force "$BINARY"

      # Smoke-test the native binary. Cross-targets (matrix.target != "")
      # can't be executed on this runner, so they remain un-smoked — the
      # un-pinned attack surface that justifies this step is "did
      # `bun build --compile` produce a runnable binary on the runner's own
      # arch", not "does the cross-compiled artifact work".
      - name: Smoke native binary
        if: matrix.target == ''
        shell: bash
        run: |
          set -eux
          BINARY="dist/${{ matrix.binary }}_${{ matrix.os }}_${{ matrix.arch }}"
          if [ "${{ matrix.binary }}" = "engine" ]; then
            "$BINARY" --smoke
          else
            "$BINARY" --version
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/${{ matrix.binary }}_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}

  # ── Publish GitHub Release with all binaries + checksums ──

  publish-release:
    name: publish-release
    needs: build-cli-binaries
    # Publish when we have a tag context — either a tag-ref trigger
    # (push/release events) or a workflow_dispatch with inputs.tag set.
    # Skips for branch-only dispatches that are validating the build
    # matrix.
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      # actions/download-artifact@v4 reliably fails when pulling 20+
      # artifacts in parallel ("Artifact download failed after 5
      # retries" — Azure blob transient). Iterate via `gh run download`
      # with per-artifact retries instead.
      - name: Download all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for binary in sk tunnel-agent engine; do
            for os in darwin linux windows; do
              for arch in x64 arm64; do
                if [ "$os" = "windows" ] && [ "$arch" = "arm64" ]; then continue; fi
                name="${binary}_${os}_${arch}"
                for attempt in 1 2 3 4 5; do
                  if gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$name" --dir "artifacts/$name" 2>&1; then
                    break
                  fi
                  if [ "$attempt" -eq 5 ]; then
                    echo "FATAL: failed to download $name after 5 attempts"
                    exit 1
                  fi
                  echo "retry $attempt for $name"
                  sleep $((attempt * 5))
                done
              done
            done
          done
          find artifacts -type f | sort

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS | sort | while read -r f; do
            sha256sum "$f" | sed 's|  \./[^/]*/||'
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SBOM (CycloneDX)
        # Pinned to a commit SHA, not @v0, because anchore frequently
        # republishes major-tagged actions with breaking changes. To
        # update: pick the latest sha at https://github.com/anchore/sbom-action
        # and re-pin here.
        uses: anchore/sbom-action@7ccf588e3cf3cc2611714c2eeae48550fbc17552 # v0.20.4
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/sbom.cdx.json
          # Don't auto-attach to the GitHub Release here; we batch the
          # whole upload in the next step so the SHA256SUMS line covers
          # the SBOM too.
          upload-release-assets: false
          upload-artifact: false

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/*/sk_*
            artifacts/*/tunnel-agent_*
            artifacts/*/engine_*
            artifacts/SHA256SUMS
            artifacts/sbom.cdx.json

  # ── Docker images ──
  # Gated: only runs when DigitalOcean registry credentials are set.
  # Absent-secret + always-fail is a footgun for public repos / forks —
  # graceful skip lets CLI binary publishing succeed independently.

  # Builds the engine image with sk + tunnel-agent binaries bundled at
  # /usr/local/share/subkit/binaries — served by /install/sk-* and
  # /install/agent-*, so any operator can `curl /install | bash`
  # against an engine without GitHub egress. `needs: build-cli-binaries`
  # so embed-binaries.sh has matrix artifacts to stage. Same image is
  # the only product surface — there is no slim-vs-with-cli split.

  build-and-push:
    name: build-and-push
    needs: [gate, build-cli-binaries]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gh run download in embed-binaries.sh reads the same-run artifacts
      # produced by build-cli-binaries — same permission as publish-release.
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: meta
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: TAG="${RELEASE_REF#subkit-v}"; echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Stage CLI binaries into docker/binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/embed-binaries.sh --from-run "$GITHUB_RUN_ID"
      - uses: docker/setup-buildx-action@v3
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Login to DOCR
        run: doctl registry login --expiry-seconds 1200
      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.engine
          push: true
          platforms: linux/amd64
          build-args: |
            ENGINE_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/subkit/engine:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/subkit/engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.migrate
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/subkit/migrate:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/subkit/migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy with health check + rollback ──

  deploy:
    name: deploy
    needs: build-and-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-and-push.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The deploy body lives in `scripts/release/deploy-body.sh` and
      # is shared with the laptop `scripts/deploy.sh` orchestrator — both
      # paths pipe this exact file into `bash -s` on the droplet so they
      # cannot drift. Behavior: doctl registry login → compose pull →
      # migrate → engine recreate (--no-deps) → Docker HEALTHCHECK poll
      # with auto-rollback → caddy bounce → prune.
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          # Defaults the per-call options used below: short connect
          # timeout so a wedged DO routing path fails fast and retries,
          # ServerAliveInterval so a stalled session doesn't hang for
          # the full 5min default. Compatible with stock OpenSSH on
          # Ubuntu 24.04 runners.
          {
            echo "Host *"
            echo "  ConnectTimeout 30"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 4"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      # Sync prod compose overlay before the deploy body runs.
      # do-bootstrap.sh originally scp'd this file once at droplet
      # provisioning, which meant config-as-code drifted whenever the
      # repo's deploy/docker-compose.prod.yml changed (image-variant
      # switches, port changes, etc.). Sync per release so the file in
      # the repo is the source of truth for every deploy.
      #
      # Retried because DigitalOcean's edge routing occasionally drops
      # the first SSH handshake from a fresh runner IP, surfacing as
      # `kex_exchange_identification: read: Connection reset by peer`.
      # Five attempts with linear backoff cover both transient
      # connection-resets and droplet-side fail2ban "soft" blocks that
      # clear within a minute.
      - name: Sync prod compose overlay to droplet
        # Bare loop, NOT `set -e` + `if`. After `if cmd; then ... fi`,
        # `$?` post-`fi` is 0 even when the inner command failed — bash
        # only exposes the inner exit code inside the test position. We
        # need the actual rc to decide retry vs. terminate.
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            scp -i ~/.ssh/id_rsa \
              deploy/docker-compose.prod.yml \
              "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/opt/subkit/docker-compose.prod.yml"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "scp succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "scp failed after 5 attempts — giving up (rc=$rc)"
              exit "$rc"
            fi
            sleep $((attempt * 15))
            echo "scp retry $((attempt + 1)) (rc=$rc)..."
          done
      - name: Run deploy-body.sh on droplet
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            ssh -i ~/.ssh/id_rsa \
              "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
              "ENGINE_VERSION='$VERSION' bash -s" \
              < scripts/release/deploy-body.sh
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "deploy-body succeeded on attempt $attempt"
              exit 0
            fi
            # Exit codes 254/255 indicate ssh transport errors —
            # connection reset, host unreachable, banner-exchange
            # timeout. Worth retrying. Anything else is a
            # deploy-body.sh failure on the droplet (image pull,
            # healthcheck, migrate) and a retry would just waste time.
            if [ "$rc" -ne 255 ] && [ "$rc" -ne 254 ]; then
              echo "deploy-body returned $rc (non-transport) — not retrying"
              exit "$rc"
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ssh deploy-body failed after 5 transport-level attempts (rc=$rc)"
              exit "$rc"
            fi
            sleep $((attempt * 15))
            echo "ssh deploy-body retry $((attempt + 1)) (transport rc=$rc)..."
          done

  smoke:
    name: smoke
    needs: [build-and-push, deploy]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-and-push.outputs.version }}
      URL: ${{ secrets.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Run smoke tests
        run: ./scripts/smoke.sh "$URL" "$VERSION"
