version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # "bun", not "npm": the npm ecosystem edits package.json only, leaving
  # bun.lock stale — every PR then dies on the frozen-lockfile install.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # zod versions are pinned to what the MCP SDK's schema types accept;
      # bumping it is deliberate work (type-compat fixes), not a routine update.
      - dependency-name: "zod"
      # pdfjs-dist must match the exact version pdf-parse pins internally
      # (API/worker version handshake) — it moves only when pdf-parse does.
      - dependency-name: "pdfjs-dist"
