<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="cockpit-product" content="SubKit" />
    <title>SubKit Cockpit</title>
    <!-- Convention §6: the same glyph as the sidebar wordmark, as its own file from
         apps/cockpit/public. The href has NO base path here; Vite prepends `base`
         ("/cockpit/") at build time. Writing it here yields "/cockpit/cockpit/favicon.svg",
         which the Cockpit handler answers with the SPA fallback: 200, text/html, a tab
         without an icon. cockpit-favicon.test.ts checks source against build output. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // BLOCKING, and in the document rather than in the bundle. The class has
      // to be on <html> before the first paint; applied from an effect instead,
      // a dark-mode reload shows a full white frame first, which at 03:00 is
      // the difference between reading a page and flinching away from it.
      //
      // This is the console's only inline script; the engine CSP allows its
      // exact hash and does not allow arbitrary inline scripts.
      var stored
      var dark
      try {
        stored = localStorage.getItem('sk-cockpit-theme')
        dark = stored === 'dark' || ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
