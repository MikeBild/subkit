# Optional pre-commit hook for subkit. Install lefthook
# (https://github.com/evilmartians/lefthook) and run `lefthook install`
# to enable. The repo does NOT require lefthook — CI re-runs every
# command in this file, so contributors who skip the install are fine.
#
# Usage:
#   brew install lefthook && lefthook install

pre-commit:
  parallel: true
  commands:
    lint:
      run: bun run lint
      tags:
        - quality
    typecheck:
      run: bun run typecheck
      tags:
        - quality
    unit-tests:
      # Fast suite only — the full integration suite needs a live
      # Postgres + pg-boss schema and is intentionally skipped here.
      run: bun run test:unit
      tags:
        - tests
