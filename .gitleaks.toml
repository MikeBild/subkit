[extend]
useDefault = true

[[allowlists]]
description = "diagnostics leak-canary fakes — intentional, self-labelled test fixtures"
targetRules = ["aws-access-token"]
paths = [
  '''apps/engine/src/http/tests/diagnostics\.test\.ts''',
]
regexes = [
  '''AKIA(FAKE|TEST)[A-Z0-9]*(LEAK|CANARY)[A-Z0-9]*''',
]

[[allowlists]]
description = "MCP OAuth test-fixture tokens — sequential-alphabet fakes"
targetRules = ["stripe-access-token", "generic-api-key"]
paths = [
  '''apps/engine/src/auth/oauth/.*\.test\.ts''',
]
regexes = [
  '''[a-z_]+abcdefghijklmnopqrstuvwxyz[0-9]+''',
]

[[allowlists]]
description = "fake secrets in *.test.ts(x) fixtures — production code stays fully scanned"
targetRules = [
  "generic-api-key",
  "jwt",
  "stripe-access-token",
  "hubspot-api-key",
  "curl-auth-header",
  "gitlab-pat",
  "aws-access-token",
  "slack-bot-token",
  "slack-webhook-url",
  "github-pat",
  "digitalocean-pat",
  "private-key",
]
paths = [
  '''.*\.test\.tsx?$''',
]

[[allowlists]]
description = "engine --smoke redaction self-test fake token"
targetRules = ["generic-api-key"]
paths = [
  '''apps/engine/src/index\.ts''',
]
regexes = [
  '''wf_live_abcdef1234567890''',
]

[[allowlists]]
description = "fixture UUIDs in the cockpit visual stand scripts"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''scripts/lib/cockpit-[a-z-]+\.mjs''',
]
regexes = [
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]

[[allowlists]]
description = "API access browser route fixture plaintexts - synthetic invalid key shapes"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''^scripts/lib/cockpit-api-access\.mjs$''',
]
regexes = [
  '''^wf_live_v11_3_fixture_secret$''',
  '''^wf_live_v11_5_rotated_fixture_secret$''',
]

[[allowlists]]
description = "Generated vault maintenance migration tag after the secret ownership symbol"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''(?:^|/)apps/engine/src/db/migrations/embedded\.ts$''',
]
regexes = [
  '''^[0-9]{4}_vault_maintenance$''',
]
