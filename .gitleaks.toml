[extend]
useDefault = true

[[allowlists]]
description = "diagnostics leak-canary fakes — intentional, self-labelled test fixtures"
targetRules = ["aws-access-token"]
paths = [
  '''apps/engine/src/http/tests/diagnostics\.test\.ts''',
]
regexes = [
  '''AKIA(FAKE|TEST)[A-Z0-9]*(LEAK|CANARY)[A-Z0-9]*''',
]

[[allowlists]]
description = "MCP OAuth test-fixture tokens — sequential-alphabet fakes"
targetRules = ["stripe-access-token", "generic-api-key"]
paths = [
  '''apps/engine/src/auth/oauth/.*\.test\.ts''',
]
regexes = [
  '''[a-z_]+abcdefghijklmnopqrstuvwxyz[0-9]+''',
]

[[allowlists]]
description = "fake secrets in *.test.ts(x) fixtures — production code stays fully scanned"
targetRules = [
  "generic-api-key",
  "jwt",
  "stripe-access-token",
  "hubspot-api-key",
  "curl-auth-header",
  "gitlab-pat",
  "aws-access-token",
  "slack-bot-token",
  "slack-webhook-url",
  "github-pat",
  "digitalocean-pat",
  "private-key",
]
paths = [
  '''.*\.test\.tsx?$''',
]

[[allowlists]]
description = "browser benchmark fixture logins for local fake sites; no real account"
targetRules = ["generic-api-key"]
paths = [
  '''apps/engine/eval/browser/sites\.ts''',
]

[[allowlists]]
description = "engine --smoke redaction self-test fake token"
targetRules = ["generic-api-key"]
paths = [
  '''apps/engine/src/index\.ts''',
]
regexes = [
  '''wf_live_abcdef1234567890''',
]

[[allowlists]]
description = "Generated vault maintenance migration tag after the secret ownership symbol"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''(?:^|/)apps/engine/src/db/migrations/embedded\.ts$''',
]
regexes = [
  '''^[0-9]{4}_vault_maintenance$''',
]

[[allowlists]]
description = "SFTP key-format docs named the OpenSSH and PKCS#8 header lines as examples; no key material"
targetRules = ["private-key"]
condition = "AND"
paths = [
  '''(?:^|/)apps/engine/src/http/reference/reference-file-servers-and-model-steps\.(?:en|de)\.md$''',
  '''(?:^|/)apps/engine/src/http/llms/(?:docs\.json|llms-full\.txt)$''',
]
regexes = [
  '''-----BEGIN OPENSSH PRIVATE KEY-----`\), RSA[\s\S]{0,80}\(`-----BEGIN PRIVATE KEY-----''',
]
